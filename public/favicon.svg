<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#21150c"/>
      <stop offset="1" stop-color="#080503"/>
    </radialGradient>
    <linearGradient id="brass" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
