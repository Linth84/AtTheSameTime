  <rect x="2.5" y="2.5" width="59" height="59" rx="13" fill="url(#bg)" stroke="#8b5725" stroke-width="3"/>

  <!-- gear -->
  <g transform="translate(32 32)">
    <g fill="url(#brass)">
      <rect x="-3" y="-29" width="6" height="8" rx="1"/>
      <rect x="-3" y="21" width="6" height="8" rx="1"/>
      <rect x="21" y="-3" width="8" height="6" rx="1"/>
      <rect x="-29" y="-3" width="8" height="6" rx="1"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(45)"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(90)"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(135)"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(180)"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(225)"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(270)"/>
      <rect x="-3" y="-29" width="6" height="8" rx="1" transform="rotate(315)"/>
